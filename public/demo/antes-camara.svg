<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Ejemplo de imagen antes de restaurar (contenido de demostración)">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a66"/>
      <stop offset="55%" stop-color="#6f6151"/>
      <stop offset="100%" stop-color="#584c3f"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#wood)"/>
  <rect width="600" height="750" filter="url(#grain)" opacity="0.5" fill="#3a3228"/>
  <g stroke="#4a4034" stroke-width="3" opacity="0.6" fill="none">
    <path d="M60 240h480M60 250h480M70 500h460M70 512h460"/>
    <path d="M300 240v260"/>
    <circle cx="180" cy="370" r="8" fill="#4a4034"/>
    <circle cx="420" cy="370" r="8" fill="#4a4034"/>
  </g>
  <text x="300" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#efe6d8" opacity="0.85">
    Antes — contenido de demostración
  </text>
</svg>