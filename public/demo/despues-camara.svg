<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" role="img" aria-label="Ejemplo de imagen después de restaurar (contenido de demostración)">
  <defs>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8703c"/>
      <stop offset="55%" stop-color="#8d5a2e"/>
      <stop offset="100%" stop-color="#6f4623"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#wood2)"/>
  <rect width="600" height="750" filter="url(#grain2)" opacity="0.45" fill="#4a2f16"/>
  <rect width="600" height="750" fill="url(#glow)"/>
  <g stroke="#5c3a1c" stroke-width="3" opacity="0.55" fill="none">
    <path d="M60 240h480M60 250h480M70 500h460M70 512h460"/>
    <path d="M300 240v260"/>
    <circle cx="180" cy="370" r="9" fill="#e0b872"/>
    <circle cx="420" cy="370" r="9" fill="#e0b872"/>
  </g>
  <text x="300" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fdf3e2" opacity="0.9">
    Después — contenido de demostración
  </text>
</svg>